
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Framewolf - Video Editor</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #101116;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  height: 65px;
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #292a32;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  color: #a78bfa;
}

.logo span {
  color: white;
}

main {
  max-width: 950px;
  margin: auto;
  padding: 20px;
}

h2 {
  margin-bottom: 8px;
}

.subtitle {
  color: #999;
  margin-bottom: 22px;
  font-size: 14px;
}

.upload {
  border: 2px dashed #555;
  border-radius: 14px;
  padding: 25px 15px;
  text-align: center;
  background: #191a22;
  margin-bottom: 20px;
}

.upload p {
  color: #aaa;
  margin: 10px 0;
}

button, .upload-label {
  background: #7955e9;
  color: white;
  padding: 12px 20px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

.upload-label {
  display: inline-block;
  margin-top: 8px;
}

input[type="file"] {
  display: none;
}

.preview {
  background: black;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 18px;
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
}

video {
  width: 100%;
  max-height: 430px;
  display: none;
}

.placeholder {
  color: #777;
  padding: 60px 10px;
  text-align: center;
}

.controls {
  background: #191a22;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 18px;
}

.controls button {
  margin-right: 8px;
}

.timeline {
  margin-top: 20px;
}

.timeline input {
  width: 100%;
  accent-color: #a78bfa;
  margin-top: 12px;
}

.trim {
  display: flex;
  gap: 12px;
  margin-top: 18px;
}

.trim div {
  flex: 1;
}

.trim label {
  display: block;
  color: #aaa;
  font-size: 13px;
  margin-bottom: 7px;
}

.trim input {
  width: 100%;
  padding: 10px;
  background: #292a32;
  color: white;
  border: 1px solid #444;
  border-radius: 7px;
}

.time {
  color: #aaa;
  font-size: 13px;
  margin-top: 8px;
}

footer {
  text-align: center;
  color: #777;
  padding: 25px;
  font-size: 12px;
}

@media(max-width: 500px) {
  main {
    padding: 14px;
  }
  .trim {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">FRAME<span>WOLF</span></div>
  <div>✦ Editor</div>
</header>

<main>

<h2>Online Video Editor</h2>
<p class="subtitle">
Create and edit your videos. Free to start.
</p>

<div class="upload">
  <div style="font-size:35px">🎬</div>
  <h3>Upload Your Video</h3>
  <p>Select a video from your device</p>

  <label class="upload-label" for="file">
    Choose Video
  </label>

  <input type="file" id="file" accept="video/*">
</div>

<div class="preview">
  <div class="placeholder" id="placeholder">
    Your video preview will appear here
  </div>
  <video id="video" controls playsinline></video>
</div>

<div class="controls">

  <button id="play">▶ Play</button>
  <button id="pause">⏸ Pause</button>

  <div class="timeline">

    <h3>Timeline</h3>

    <input
      type="range"
      id="seek"
      min="0"
      max="100"
      value="0"
    >

    <div class="time">
      <span id="current">0:00</span>
      /
      <span id="duration">0:00</span>
    </div>

  </div>

  <div class="trim">

    <div>
      <label>Start Time (seconds)</label>
      <input type="number" id="start" min="0" value="0">
    </div>

    <div>
      <label>End Time (seconds)</label>
      <input type="number" id="end" min="0" value="0">
    </div>

  </div>

  <p class="time" id="trimInfo">
    Upload a video to set your trim range.
  </p>

</div>

<footer>
  Framewolf © 2026 — Create Without Limits
</footer>

</main>

<script>
const file = document.getElementById("file");
const video = document.getElementById("video");
const placeholder = document.getElementById("placeholder");

const play = document.getElementById("play");
const pause = document.getElementById("pause");

const seek = document.getElementById("seek");
const current = document.getElementById("current");
const duration = document.getElementById("duration");

const start = document.getElementById("start");
const end = document.getElementById("end");
const trimInfo = document.getElementById("trimInfo");

let videoURL = null;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);

  return mins + ":" + String(secs).padStart(2, "0");
}

file.addEventListener("change", () => {
  const selected = file.files[0];

  if (!selected) return;

  if (videoURL) {
    URL.revokeObjectURL(videoURL);
  }

  videoURL = URL.createObjectURL(selected);

  video.src = videoURL;
  video.style.display = "block";
  placeholder.style.display = "none";

  video.load();
});

video.addEventListener("loadedmetadata", () => {
  seek.max = video.duration;

  duration.textContent = formatTime(video.duration);

  start.value = 0;
  end.value = video.duration.toFixed(1);

  start.max = video.duration;
  end.max = video.duration;

  trimInfo.textContent =
    "Selected range: 0 to " +
    video.duration.toFixed(1) + " seconds";
});

play.addEventListener("click", () => {
  video.play();
});

pause.addEventListener("click", () => {
  video.pause();
});

video.addEventListener("timeupdate", () => {
  seek.value = video.currentTime;
  current.textContent = formatTime(video.currentTime);
});

seek.addEventListener("input", () => {
  video.currentTime = Number(seek.value);
});

function updateTrim() {
  if (!Number.isFinite(video.duration)) return;

  let from = Number(start.value);
  let to = Number(end.value);

  from = Math.max(0, Math.min(from, video.duration));
  to = Math.max(0, Math.min(to, video.duration));

  if (from > to) {
    to = from;
    end.value = to;
  }

  start.value = from;
  end.value = to;

  trimInfo.textContent =
    "Selected range: " +
    from.toFixed(1) + " to " +
    to.toFixed(1) + " seconds";
}

start.addEventListener("change", updateTrim);
end.addEventListener("change", updateTrim);

</script>

</body>
</html>
